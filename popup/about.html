<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp Refined</title>
    <link rel="stylesheet" href="about.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">WR</div>
        <div class="identity">
          <h1>Refined</h1>
          <p>WhatsApp, with better controls.</p>
        </div>
        <span class="state-dot" id="stateDot" aria-hidden="true"></span>
      </header>

      <section class="activation" aria-labelledby="activationTitle">
        <div>
          <span class="eyebrow">Extension status</span>
          <h2 id="activationTitle">Refined is active</h2>
          <p id="activationHelp">Your layout and privacy preferences are applied.</p>
        </div>
        <button id="activationButton" type="button" aria-pressed="true">Pause Refined</button>
      </section>

      <section class="details" aria-label="Creator details">
        <div class="detail-row">
          <span>Creator</span>
          <strong>Rami</strong>
        </div>
        <div class="detail-row">
          <span>Contact</span>
          <strong aria-label="No contact added yet">—</strong>
        </div>
      </section>

      <footer>
        <p>Full settings are available from the Settings button inside WhatsApp’s sidebar.</p>
        <span id="version">v0.6.3</span>
      </footer>
    </main>
    <script src="../src/settings.js"></script>
    <script src="about.js"></script>
  </body>
</html>
