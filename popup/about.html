<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pane</title>
    <link rel="stylesheet" href="about.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="../icons/icon.svg" alt="">
        <div class="identity">
          <h1>Pane</h1>
          <p>A calmer workspace for WhatsApp Web.</p>
        </div>
        <span class="state-dot" id="stateDot" aria-hidden="true"></span>
      </header>

      <section class="activation" aria-labelledby="activationTitle">
        <div>
          <span class="eyebrow">Extension status</span>
          <h2 id="activationTitle">Pane is active</h2>
          <p id="activationHelp">Your layout and privacy preferences are applied.</p>
        </div>
        <button id="activationButton" type="button" aria-pressed="true">Pause Pane</button>
      </section>

      <section class="details" aria-label="Privacy summary">
        <div class="detail-row">
          <span>Data</span>
          <strong>Stays on your device</strong>
        </div>
        <div class="detail-row">
          <span>Access</span>
          <strong>WhatsApp Web only</strong>
        </div>
      </section>

      <footer>
        <p>Open Pane from the Settings button inside WhatsApp’s sidebar.</p>
        <span id="version">v1.0.0</span>
      </footer>
    </main>
    <script src="../src/settings.js"></script>
    <script src="about.js"></script>
  </body>
</html>
