name: Publish tagged release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify version and changelog
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Verify locale files
        run: npm run locales:check

      - name: Run tests
        run: npm test

      - name: Build release archive
        run: npm run package

      - name: Create checksum
        run: |
          cd dist
          sha256sum "refined-whatsapp-web-${GITHUB_REF_NAME}.zip" > "refined-whatsapp-web-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/refined-whatsapp-web-${GITHUB_REF_NAME}.zip"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --verify-tag \
              --title "Refined WhatsApp Web ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
